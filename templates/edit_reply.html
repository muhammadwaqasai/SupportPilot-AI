<!DOCTYPE html>
<html>

<head>

    <title>Edit AI Reply</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        textarea{

            width:100%;
            height:250px;
            font-size:16px;

        }

        .box{

            margin-bottom:20px;

        }

        button{

            padding:10px 20px;
            font-size:16px;

        }

    </style>

</head>

<body>

<h2>Edit AI Reply Before Sending</h2>

<div class="box">

<b>Customer:</b>

{{ customer.customer_name }}

</div>


<div class="box">

<b>Customer Message</b>

<br><br>

{{ customer.message }}

</div>


<form method="POST">

<textarea name="reply">

{{ customer.ai_reply }}

</textarea>

<br><br>

<button type="submit">

Approve & Send Reply

</button>

</form>

</body>

</html>
